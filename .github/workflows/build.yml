name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: |
          ./build.ps1
          if (-not (Test-Path NetMeter.exe)) { throw 'NetMeter.exe was not built' }
          (Get-Item NetMeter.exe).VersionInfo | Format-List ProductName, ProductVersion, FileVersion

      - name: Upload unsigned build
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NetMeter
          path: NetMeter.exe

      # Runs once the SignPath Foundation project exists: set the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN.
      - name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: NetMeter
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout leaves a lightweight tag; fetch the annotated one so its message becomes the notes
          git fetch --force origin "refs/tags/$($env:GITHUB_REF_NAME):refs/tags/$($env:GITHUB_REF_NAME)"
          $exe = if (Test-Path signed/NetMeter.exe) { 'signed/NetMeter.exe' } else { 'NetMeter.exe' }
          gh release create $env:GITHUB_REF_NAME $exe --title "NetMeter $env:GITHUB_REF_NAME" --notes-from-tag
